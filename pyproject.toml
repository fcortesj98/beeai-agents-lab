[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beeai-agentic-lab"
version = "1.0.0"
description = "Modular refactor of IBM Skills Network's 'Building Agentic AI Systems with the BeeAI Framework' lab"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "beeai-framework[wikipedia]==0.1.35",
    "mcp>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
beeai-lab = "beeai_lab.cli:main"

[tool.setuptools.packages.find]
include = ["beeai_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
